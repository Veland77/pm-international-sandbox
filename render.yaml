services:
  - type: web
    name: pm-international-sandbox
    runtime: node
    plan: pro
    buildCommand: npm install
    startCommand: npm run seed:if-empty && npm start
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: sandbox-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/sandbox.db
      - key: ATTACHMENTS_DIR
        value: /data/attachments
    domains:
      - sandbox.litleholm.no
